<!DOCTYPE html>
<html>

<head>

    <title>Share Your Feedback</title>

    <style>

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #17233c;
        }

        .container {
            max-width: 520px;
            margin: auto;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 8px;
        }

        .icon {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #2c6bed;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        .subtitle {
            margin: 4px 0 24px 60px;
            color: #6f7b8f;
            font-size: 13px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        select,
        textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #ccd2dc;
            border-radius: 5px;
            padding: 10px;
            font-size: 13px;
            font-family: Arial, sans-serif;
            background: white;
        }

        select {
            height: 40px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        textarea:focus,
        select:focus {
            outline: none;
            border-color: #2c6bed;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 22px;
        }

        button {
            border: none;
            border-radius: 5px;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .cancel {
            background: #eef0f3;
            color: #273142;
        }

        .submit {
            background: #2c6bed;
            color: white;
        }

        .submit:hover {
            background: #1f56c7;
        }

        .submit:disabled {
            background: #aab4c5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 12px;
            text-align: right;
            font-size: 12px;
            min-height: 16px;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="header">

        <div class="icon">
            💬
        </div>

        <h1>
            Share Your Feedback
        </h1>

    </div>


    <div class="subtitle">
        Help us improve. Your feedback is valuable.
    </div>


    <div class="field">

        <label for="feedbackType">
            Feedback Type
        </label>

        <select id="feedbackType">

            <option>Data Issue</option>

            <option>Performance Issue</option>

            <option>Enhancement</option>

            <option>Other</option>

        </select>

    </div>


    <div class="field">

        <label for="comment">
            Comment
        </label>

        <textarea
            id="comment"
            maxlength="500"
            placeholder="Tell us what you noticed..."></textarea>

    </div>


    <div class="actions">

        <button
            class="cancel"
            id="cancelButton">

            Cancel

        </button>


        <button
            class="submit"
            id="submitButton">

            Submit

        </button>

    </div>


    <div id="status"></div>

</div>


<script src="./tableau.extensions.1.latest.js"></script>


<script>

    /*
     * Initialize Tableau Dialog
     */

    tableau.extensions.initializeDialogAsync()

        .then(() => {

            console.log("Feedback dialog initialized");

        })

        .catch((error) => {

            console.error(
                "Dialog initialization error:",
                error
            );

        });


    /*
     * Get elements
     */

    const feedbackType =
        document.getElementById("feedbackType");

    const comment =
        document.getElementById("comment");

    const submitButton =
        document.getElementById("submitButton");

    const cancelButton =
        document.getElementById("cancelButton");

    const status =
        document.getElementById("status");


    /*
     * Cancel
     */

    cancelButton.addEventListener("click", () => {

        tableau.extensions.ui.closeDialog("cancel");

    });


    /*
     * Submit
     */

    submitButton.addEventListener(
        "click",
        async () => {

            const type =
                feedbackType.value;

            const commentValue =
                comment.value.trim();


            /*
             * Validate comment
             */

            if (!commentValue) {

                status.innerText =
                    "Please enter a comment.";

                return;

            }


            submitButton.disabled = true;

            status.innerText =
                "Submitting...";


            try {

                const response = await 
				fetch("https://script.google.com/macros/s/AKfycbyhZD5XP1lxigouPIhTZHRLsO3t1DXs2iJc_6ZA4sl-GDTUmOzuCEJ65f_U_lWcFDSF/exec", {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            region: "Not specified",

                            feedback_type: type,

                            comment: commentValue

                        })

                    }
                );


                const result =
                    await response.json();


                if (response.ok) {

                    status.innerText =
                        "✓ Feedback submitted successfully.";


                    /*
                     * Close dialog after submission
                     */

                    setTimeout(() => {

                        tableau.extensions.ui
                            .closeDialog("submitted");

                    }, 800);

                }

                else {

                    status.innerText =
                        "Unable to submit feedback.";

                    submitButton.disabled = false;

                }

            }

            catch (error) {

                console.error(error);

                status.innerText =
                    "Connection error.";

                submitButton.disabled = false;

            }

        }
    );

</script>

</body>

</html>
